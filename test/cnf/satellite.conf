# Satellite engine test configuration
#
# The images come from the smartmet-test-data package. Set
# SATELLITE_TEST_DATA to point somewhere else, for example at a copy of
# the production tree, when developing against other data.
#
# The directory layout is the production one, so these settings can be
# copied to a production configuration as they are.

rootdir = "$(SATELLITE_TEST_DATA)";

# One product is one composite of one satellite. The producer says which
# satellite the images come from and the parameter which composite of it,
# so that a client can list the satellites and then the composites of the
# one the user picked.

products:
{
        # RGBA in a projected coordinate system: the primary case

        meteosat_natural:
        {
                producer = "meteosat";
                parameter = "natural";
                directory = "seviri/0deg/level3/EPSG3035/img";
                pattern = ".*_EPSG3035_natural_with_colorized_ir_clouds\\.tif$";
                title = "Natural colours with colorized IR clouds";
                abstract = "SEVIRI natural colour composite of the 0 degree service";
                keywords = ["satellite", "seviri", "meteosat"];
                refresh_interval_secs = 60;
                max_files = 50;
        };

        # Another composite of the same satellite, in the native
        # geostationary projection. This one has no overviews.

        meteosat_ir108:
        {
                producer = "meteosat";
                parameter = "ir108";
                directory = "seviri/0deg/level3/geos/img";
                pattern = ".*_geos_ir108\\.tif$";
                title = "Infrared 10.8 um";
                abstract = "SEVIRI infrared imagery in the satellite projection";
                keywords = ["satellite", "seviri", "meteosat"];
                max_files = 50;
        };

        # Uncoloured Float32 values, which need a colour map

        meteosat_ctth_tempe:
        {
                producer = "meteosat";
                parameter = "ctth_tempe";
                directory = "nwcsaf_geo/0deg/level3/EPSG3035/img";
                pattern = ".*_ctth_tempe\\.tif$";
                title = "Cloud top temperature";
                abstract = "NWC SAF cloud top temperature in Kelvin";
                keywords = ["satellite", "nwcsaf"];
                max_files = 50;
        };

        # Several timesteps of one composite: exercises the time dimension

        meteosat_fog_rgb:
        {
                producer = "meteosat";
                parameter = "fog_rgb";
                directory = "test/dynamic_fog_rgb_ir";
                pattern = ".*_fog_rgb_ir\\.tif$";
                title = "Fog RGB";
                abstract = "Fog RGB composite based on infrared channels";
                keywords = ["satellite", "seviri", "meteosat", "fog"];
                max_files = 50;
        };

        # The Eckert IV projection has no EPSG code and is described by
        # the embedded WKT only. This one is a cloud optimized GeoTIFF
        # with an overview pyramid, which is what makes a zoomed out view
        # of a large image cheap.

        meteosat_eckert_wv73:
        {
                producer = "meteosat_eckert";
                parameter = "wv73";
                directory = "seviri/0deg/level3/ESRI54012/img";
                pattern = ".*_geos_wv73\\.tif$";
                title = "Water vapour 7.3 um in Eckert IV";
                abstract = "SEVIRI water vapour imagery in the Eckert IV projection";
                keywords = ["satellite", "seviri", "meteosat"];
                max_files = 50;
        };

        # Three composites share this directory and all three file names
        # end in ir108.tif, so a pattern which is not anchored at the end
        # would pick up all of them. The next two products check that.

        metop_ir108:
        {
                producer = "metop";
                parameter = "ir108";
                directory = "avhrr/ears/level3/EPSG3035/img";
                pattern = ".*_EPSG3035_ir108\\.tif$";
                title = "AVHRR infrared 10.8 um";
                abstract = "AVHRR EARS infrared imagery";
                keywords = ["satellite", "avhrr", "metop"];
                max_files = 50;
        };

        metop_vis06:
        {
                producer = "metop";
                parameter = "vis06";
                directory = "avhrr/ears/level3/EPSG3035/img";
                pattern = ".*_EPSG3035_vis06_with_ir108\\.tif$";
                title = "AVHRR visible 0.6 um with infrared clouds";
                abstract = "AVHRR EARS visible imagery with infrared cloud tops";
                keywords = ["satellite", "avhrr", "metop"];
                max_files = 50;
        };

};
